name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - name: 检查 dist/_worker.js 是否与源码同步
        run: git diff --exit-code dist/_worker.js
